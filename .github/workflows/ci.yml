name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tui-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install TUI dependencies
        run: npm ci --omit=optional

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

  gui-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install full dependencies
        run: npm ci

      - name: Build CLI and GUI (${{ matrix.label }})
        run: npm run build:gui

      - name: Verify package configuration
        shell: bash
        run: node -e "const p=require('./package.json'); if (!p.build.mac || !p.build.linux || !p.build.win) process.exit(1); console.log(JSON.stringify({platform:process.platform,arch:process.arch,mac:p.build.mac.target,linux:p.build.linux.target,win:p.build.win.target},null,2))"

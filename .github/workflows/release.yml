name: Release Blackbox

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build:app:windows -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create Windows checksums
        shell: pwsh
        run: Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Substring((Get-Location).Path.Length + 1) } | Set-Content release/SHA256SUMS-windows-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-windows-x64
          path: release/*
          if-no-files-found: error

  package-linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopenjp2-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build:app:linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-linux-x64
          path: release/*
          if-no-files-found: error

  package-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopenjp2-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build:gui
      - run: npm run prepare:packaged-browser
      - run: npx electron-builder --linux AppImage deb --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-linux-arm64
          path: release/*
          if-no-files-found: error

  package-macos-x64:
    name: macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build:gui
      - run: npm run prepare:packaged-browser
      - run: npx electron-builder --mac dmg zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-macos-x64
          path: release/*
          if-no-files-found: error

  package-macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build:gui
      - run: npm run prepare:packaged-browser
      - run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-macos-arm64
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - package-windows
      - package-linux
      - package-linux-arm64
      - package-macos-x64
      - package-macos-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=optional
      - uses: actions/download-artifact@v4
        with:
          pattern: blackbox-*
          path: release-artifacts
          merge-multiple: false
      - name: Merge update metadata for multi-architecture platforms
        run: |
          node scripts/merge-update-metadata.js release-artifacts latest.yml
          node scripts/merge-update-metadata.js release-artifacts latest-linux.yml
          node scripts/merge-update-metadata.js release-artifacts latest-mac.yml
      - name: Collect assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            base="${file##*/}"
            case "$base" in
              Blackbox-*.exe|Blackbox-*.exe.blockmap|Blackbox-*.AppImage|Blackbox-*.AppImage.zsync|Blackbox-*.deb|Blackbox-*.dmg|Blackbox-*.dmg.blockmap|Blackbox-*.zip|Blackbox-*.zip.blockmap|SHA256SUMS-*)
                cp "$file" "release-assets/$base"
                ;;
            esac
          done < <(find release-artifacts -type f -print0)
          for metadata in latest.yml latest-linux.yml latest-mac.yml; do
            if [ -f "release-artifacts/$metadata" ]; then cp "release-artifacts/$metadata" "release-assets/$metadata"; fi
          done
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Blackbox ${RELEASE_TAG}" \
            --generate-notes

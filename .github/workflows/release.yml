name: Release Blackbox

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:app -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum Blackbox-*.exe > SHA256SUMS.txt)
          gh release create "${RELEASE_TAG}" release/Blackbox-*.exe release/Blackbox-*.exe.blockmap release/latest.yml release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --title "Blackbox ${RELEASE_TAG}" --generate-notes

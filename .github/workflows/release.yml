name: Release Blackbox

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - run: npm run tauri:build
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/notes/${RELEASE_TAG}.md"
          test -f "$notes" || { echo "Missing $notes: write the release notes for this version first."; exit 1; }
          cd src-tauri/target/release/bundle/nsis
          sha256sum Blackbox_*_x64-setup.exe > SHA256SUMS.txt
          cd -
          gh release create "${RELEASE_TAG}" src-tauri/target/release/bundle/nsis/Blackbox_*_x64-setup.exe src-tauri/target/release/bundle/nsis/SHA256SUMS.txt             --repo "${GITHUB_REPOSITORY}" --verify-tag --title "Blackbox ${RELEASE_TAG}" --notes-file "$notes"

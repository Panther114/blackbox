[package]
name = "blackbox"
version = "2.0.0"
description = "BlackboardChina course-material downloader"
edition = "2021"
rust-version = "1.80"

[lib]
name = "blackbox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

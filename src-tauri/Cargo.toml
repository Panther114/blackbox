[package]
name = "blackbox"
version = "2.0.0"
description = "BlackboardChina course-material downloader"
edition = "2021"
rust-version = "1.80"

[lib]
name = "blackbox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
scraper = "0.27.0"
reqwest = { version = "0.13.3", features = ["cookies", "stream", "gzip", "form"] }
tokio = { version = "1.53.2", features = ["fs", "sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3.34"
tokio-util = "0.7.19"
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
